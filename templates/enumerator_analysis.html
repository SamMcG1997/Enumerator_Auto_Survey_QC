<!DOCTYPE html>
<html>
<head>
  <title>{{ enum_name }} - Histogram</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<h1>Enumerator Analysis: {{ enum_name }}</h1>
<body>
  <h4>Choose Dates for Analysis</h4>
<form method="POST" style="margin-bottom: 20px;">
  <input type="hidden" name="enum_name_hidden" value="{{ enum_name }}">
  <label>Select day(s):</label>
  <select name="selected_days" multiple size="6">
    {% for d in unique_days %}
      <option value="{{ d }}"
        {% if d in selected_days %} selected {% endif %}>
        {{ d }}
      </option>
    {% endfor %}
  </select>

  <button type="submit">Filter</button>
</form>

<br><br>
<a href="{{ url_for('index') }}">Upload another file</a><br>
<a href="{{ url_for('analysis') }}">Back to overall analysis</a>
<br><br>
</body>

<img src="{{ url_for('static', filename=hist_filename) }}" alt="Enumerator histogram">

<h2>Analysis for {{ enum_name }}</h2>
<div class="table">
  <table>
    <thead>
      <tr>
        {% for col in enum_data[0].keys() %}
        <th>{{ col }}</th>
        {% endfor %}
      </tr>
    </thead>

    <tbody>
      {% for row in enum_data %}
      <tr>
        {% for value in row.values() %}
        <td>{{ value }}</td>
        {% endfor %}
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>


</body>
</html>
