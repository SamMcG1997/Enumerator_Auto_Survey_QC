<form action="/select_columns" method="POST">
  <h3>Enumerators & Overall Time</h3>
  <label>Enumerator column:</label>
  <select name="enumerator_col" required>
    {% for col in columns %}
    <option value="{{ col }}">{{ col }}</option>
    {% endfor %}
  </select>
  <label>Start Time:</label>
  <select name="start_col" required>
    {% for col in columns %}
    <option value="{{ col }}">{{ col }}</option>
    {% endfor %}
  </select>

  <label>End Time:</label>
  <select name="end_col" required>
    {% for col in columns %}
    <option value="{{ col }}">{{ col }}</option>
    {% endfor %}
  </select>


  <h3>Section Selection (Optional)</h3>
  <label>How many sections?</label>
  <input type="number" id="sections" name="sections" min="0" required>
  <button type="button" onclick="generateSectionSelectors()">Select Section Columns</button>
  <div id="sections_bit"></div>

  <br><br>
  <button type="submit">Continue to Analysis</button>
  
</form>

<h2>Preview of Uploaded Data (first 5 rows)</h2>

<div class="table">
  <table>
    <thead>
      <tr>
        {% for col in columns %}
        <th>{{ col }}</th>
        {% endfor %}
      </tr>
    </thead>

    <tbody>
      {% for row in first_rows %}
      <tr>
        {% for col in columns %}
        <td>{{ row[col] }}</td>
        {% endfor %}
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

<script>
function generateSectionSelectors() {
    const sections = document.getElementById("sections").value;
    const container = document.getElementById("sections_bit");
    container.innerHTML = "";

    for (let i = 1; i <= sections; i++) {
        container.innerHTML += `
            <h4>Section ${i}</h4>
            Start:
            <select name="section_${i}_start">
              {% for col in columns %}
              <option value="{{ col }}">{{ col }}</option>
              {% endfor %}
            </select>
            End:
            <select name="section_${i}_end">
              {% for col in columns %}
              <option value="{{ col }}">{{ col }}</option>
              {% endfor %}
            </select>
            <br><br>
        `;
    }
}
</script>
